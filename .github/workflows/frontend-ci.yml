name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      # 静态扫描（CR-110，兑现 CR-103 §5 备料 / 问题清单 E-003 的 CI 残余）：
      # 放在 Build 之前——lint 比构建快，失败得更早
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
