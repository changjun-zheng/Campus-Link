# 本文件是「开发零配置可起」那一层：下面所有 ${VAR:dev-default} 的默认值都是**开发态取值**。
# 生产必须叠加 profile：`--spring.profiles.active=prod`（见 application-prod.yml），
# 由 config/ProductionSafetyGuard 在启动时机器拦截四条红线（旁路 / 固定验证码 / 密钥仍为开发值 / 默认库口令），
# 漏配即启动失败——不再靠"启动后看一眼 WARN"。
# ⚠️ 改了本文件任何一处占位符默认值，必须同步 ProductionSafetyGuard.DEV_VALUES，否则守护测试即红（两处即两个事实源）。
server:
  # 默认 8088：本机 8080 已被另一项目的 Tomcat 占用（CR-011）；生产可用 SERVER_PORT 覆盖
  port: ${SERVER_PORT:8088}

spring:
  autoconfigure:
    exclude: org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
  application:
    name: campus-link-backend
  # 结构变更（DDL）由 Flyway 版本化管理，规范见 src/main/resources/db/migration/README.md（CR-014）
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 不对"非空但无 Flyway 历史"的库做静默认领：应显式 baseline 或清库重建，避免结构与迁移历史不一致
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  datasource:
    # 时间口径（CR-051，闭环台账 L-6）：V1 各表用 DEFAULT CURRENT_TIMESTAMP 写 DATETIME，取值取决于**会话时区**；
    # 只声明 connectionTimeZone 而不加 forceConnectionTimeZoneToSession 时，驱动不改会话时区，
    # 本机 SYSTEM（UTC+8）会把本地墙钟写进库、再被当成 UTC 读出来，全库时间戳整体偏 +8 小时。
    # 两个参数必须成对出现，缺一个即回到缺陷状态——由 DataSourceTimezoneTest 守护。
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campuslink}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:campuslink}
    password: ${DB_PASSWORD:campuslink}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    test-connection: false
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLED:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS_ENABLED:true}
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLED:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.debug: false
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 头像上传（CR-191）：文件本身 ≤2MB（应用层再校验），请求体留出表单开销；
      # 超限由 GlobalExceptionHandler 映射为 413 / 1005，不会落进 500 兜底
      max-file-size: 5MB
      max-request-size: 6MB

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/swagger-ui.html

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
  mapper-locations: classpath*:mapper/**/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # dev 用 CODE_SENDER_MODE=log 不发信，但 spring.mail.host 存在会让 Boot 注册邮件健康指示器并去连 SMTP，
      # 导致 /actuator/health 恒为 DOWN。默认关闭；切到 CODE_SENDER_MODE=mail 时应置 MAIL_HEALTH_ENABLED=true。
      enabled: ${MAIL_HEALTH_ENABLED:false}

campuslink:
  post-images:
    upload-enabled: ${POST_IMAGES_UPLOAD_ENABLED:true}
    read-enabled: ${POST_IMAGES_READ_ENABLED:true}
    dir: ${POST_IMAGES_DIR:var/uploads/post-images}
  notifications:
    delivery: ${NOTIFICATION_DELIVERY:sync}
    rabbitmq:
      enabled: ${NOTIFICATION_RABBITMQ_ENABLED:false}
  jwt:
    # 生产必须通过环境变量覆盖（上线检查清单项）
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
    ttl-days: 7
  crypto:
    # 开发默认密钥仅限本地联调；hash/crypt 两把密钥独立，生产必须覆盖（上线检查清单项）
    hash-key: ${APP_HASH_KEY:dev-only-hash-key-change-me-32-bytes-minimum!}
    crypt-key: ${APP_CRYPT_KEY:dev-only-crypt-key-change-me-32-bytes-minimum!}
  captcha:
    ttl-minutes: 5
    resend-interval-seconds: 60
    daily-limit: 10
    # 固定验证码（开发联调便利，免去每次从后端日志捞码）：配置后所有验证码都等于该值。
    # ⚠️ 等同于取消验证码防线——非本机环境必须留空（CAPTCHA_FIXED_CODE=），上线检查清单项。
    fixed-code: ${CAPTCHA_FIXED_CODE:123456}
  verify:
    # 默认 10 次/小时/IP 不变；仅开发期批量灌账号（scripts/data/D001，一次 45 次核验）时临时抬高
    ip-hourly-limit: ${VERIFY_IP_HOURLY_LIMIT:10}
    ticket-ttl-minutes: 5
  roster:
    # 学籍核验旁路（内置测试名册）：仅限开发联调；生产必须为 false（上线检查清单项）
    bypass: ${APP_ROSTER_BYPASS:true}
  code-sender:
    # log = 开发模式（验证码只打日志）；mail = 真实发送
    mode: ${CODE_SENDER_MODE:log}
    from: ${MAIL_FROM:}
  moderation:
    # 机审通道（F-SAFE-001）：log = 只记录放行（开发缺省）；local = 本地词表，命中即拦（fail-closed）；
    # 真实服务商适配待 A3-8 决策与凭据（届时新增 mode=aliyun / tencent 适配器即可）
    mode: ${MODERATION_MODE:log}
    # local 模式必填（逗号分隔）；留空即启动失败——不允许"空词表 = 静默放行"
    words: ${MODERATION_WORDS:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  ai:
    similar:
      enabled: true
      min-title-length: 6
      max-results: 3
  assistant:
    # 帖子选中文本问 AI（CR-200）：默认关闭；开启前必须注入 DEEPSEEK_API_KEY，否则启动失败。
    # 密钥只从环境变量读取，任何源码 / 示例 / 测试都不得写入可用凭据。
    enabled: ${ASSISTANT_ENABLED:false}
    provider: deepseek
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    api-key: ${DEEPSEEK_API_KEY:}
    daily-limit: 20
    per-minute-limit: 5
    max-concurrent-per-user: 1
    session-ttl-minutes: 30
    max-selected-chars: 2000
    max-question-chars: 500
    max-user-turns: 5
    max-output-tokens: 1024
    connect-timeout-seconds: 10
    request-timeout-seconds: 90
    sse-timeout-seconds: 120
    temperature: 0.3
    # 每日配额按校区自然日切割，避免服务器 UTC 时区把"今天"算错
    quota-zone: Asia/Shanghai
    moderate-output: true
    privacy-notice-version: "1"
    quick-prompts:
      - 这段内容是什么意思？
      - 举个例子解释一下
      - 这段代码在做什么？
  avatar:
    # 自定义头像（CR-191）：本地磁盘存储；生产用 AVATAR_DIR 指向持久卷，
    # 再由 Nginx 代理 /media/（部署清单在 CR-079 实施时补）
    dir: ${AVATAR_DIR:var/uploads/avatars}
    max-bytes: 2097152       # 2MB；与 spring.servlet.multipart.max-file-size 是两道门
    max-dimension: 4096      # 解码前先看头部，防解压炸弹
    size: 512                # 统一输出边长（2× 屏下 256 显示仍清晰）
    quality: 0.9             # JPEG 质量
  search:
    # 搜索实现（ADR-004 / CR-181）：mysql = 现行 MySQL ngram FULLTEXT（缺省）；meilisearch = 规模升级。
    # 切 meilisearch 后接口路径 / 参数 / 响应外壳不变，total 改由 Meili estimatedTotalHits 提供（估算值）。
    engine: ${SEARCH_ENGINE:mysql}
    meili:
      url: ${MEILI_URL:http://127.0.0.1:7700}
      # 开发期本机 Meili 可不开 master key（仅绑定 127.0.0.1）；生产必须注入，守卫强制。
      api-key: ${MEILI_API_KEY:}
      index: ${MEILI_INDEX:posts_v1}
    batch-size: 1000
    lock-ttl-seconds: 30
    # 下面两项只被 SearchIndexScheduler 的 @Scheduled 占位符消费，不绑定 AppProperties（避免两个事实源）
    sync-interval-ms: ${SEARCH_SYNC_INTERVAL_MS:30000}
    sync-initial-delay-ms: ${SEARCH_SYNC_INITIAL_DELAY_MS:15000}
  hot:
    # 热榜（ADR-006，CR-058）。互动分 = reply-weight×回复 + like-weight×赞 + favorite-weight×收藏，
    # hot_score = 互动分 × exp(-decay-per-hour × 小时龄)。
    # 权重与 λ 是**待试点数据调优**的参数（PRD Q6），不是结论——调参只改这里，不改代码。
    reply-weight: 3.0          # 回复权重最高：论坛的核心互动且成本最高
    like-weight: 1.0
    favorite-weight: 2.0       # 收藏成本高于点赞（要回访），互动性弱于回复
    decay-per-hour: 0.05       # ADR-006 原文值：20 小时衰减到 e^-1 ≈ 37%
    window-days: 30            # 只重算窗口内的帖子；窗口外置 0（指数衰减只降不消，不归零则老帖永久霸榜）
    batch-size: 500            # 游标分批读—算—写回，避免一次把整窗候选读进内存
    lock-ttl-seconds: 300      # ⚠️ 须 ≤ 刷新周期：锁不显式释放、靠 TTL 兜底，TTL 比周期长会把实际刷新周期变成 TTL
    # 下面两项只被 HotScoreRefreshScheduler 的 @Scheduled 占位符消费，**不绑定到 AppProperties**（避免两个事实源）
    refresh-interval-ms: ${HOT_REFRESH_INTERVAL_MS:600000}   # ADR-006 原文 10 分钟
    initial-delay-ms: ${HOT_INITIAL_DELAY_MS:15000}          # 新部署不必等一个完整周期才有分数

# CR-193: enabled and delivery are independent so rollback can drain old messages in sync mode.
