# 本文件是「开发零配置可起」那一层：下面所有 ${VAR:dev-default} 的默认值都是**开发态取值**。
# 生产必须叠加 profile：`--spring.profiles.active=prod`（见 application-prod.yml），
# 由 config/ProductionSafetyGuard 在启动时机器拦截四条红线（旁路 / 固定验证码 / 密钥仍为开发值 / 默认库口令），
# 漏配即启动失败——不再靠"启动后看一眼 WARN"。
# ⚠️ 改了本文件任何一处占位符默认值，必须同步 ProductionSafetyGuard.DEV_VALUES，否则守护测试即红（两处即两个事实源）。
server:
  # 默认 8088：本机 8080 已被另一项目的 Tomcat 占用（CR-011）；生产可用 SERVER_PORT 覆盖
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: campus-link-backend
  # 结构变更（DDL）由 Flyway 版本化管理，规范见 src/main/resources/db/migration/README.md（CR-014）
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 不对"非空但无 Flyway 历史"的库做静默认领：应显式 baseline 或清库重建，避免结构与迁移历史不一致
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  datasource:
    # 时间口径（CR-051，闭环台账 L-6）：V1 各表用 DEFAULT CURRENT_TIMESTAMP 写 DATETIME，取值取决于**会话时区**；
    # 只声明 connectionTimeZone 而不加 forceConnectionTimeZoneToSession 时，驱动不改会话时区，
    # 本机 SYSTEM（UTC+8）会把本地墙钟写进库、再被当成 UTC 读出来，全库时间戳整体偏 +8 小时。
    # 两个参数必须成对出现，缺一个即回到缺陷状态——由 DataSourceTimezoneTest 守护。
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campuslink}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:campuslink}
    password: ${DB_PASSWORD:campuslink}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/swagger-ui.html

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
  mapper-locations: classpath*:mapper/**/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # dev 用 CODE_SENDER_MODE=log 不发信，但 spring.mail.host 存在会让 Boot 注册邮件健康指示器并去连 SMTP，
      # 导致 /actuator/health 恒为 DOWN。默认关闭；切到 CODE_SENDER_MODE=mail 时应置 MAIL_HEALTH_ENABLED=true。
      enabled: ${MAIL_HEALTH_ENABLED:false}

campuslink:
  jwt:
    # 生产必须通过环境变量覆盖（上线检查清单项）
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
    ttl-days: 7
  crypto:
    # 开发默认密钥仅限本地联调；hash/crypt 两把密钥独立，生产必须覆盖（上线检查清单项）
    hash-key: ${APP_HASH_KEY:dev-only-hash-key-change-me-32-bytes-minimum!}
    crypt-key: ${APP_CRYPT_KEY:dev-only-crypt-key-change-me-32-bytes-minimum!}
  captcha:
    ttl-minutes: 5
    resend-interval-seconds: 60
    daily-limit: 10
    # 固定验证码（开发联调便利，免去每次从后端日志捞码）：配置后所有验证码都等于该值。
    # ⚠️ 等同于取消验证码防线——非本机环境必须留空（CAPTCHA_FIXED_CODE=），上线检查清单项。
    fixed-code: ${CAPTCHA_FIXED_CODE:123456}
  verify:
    # 默认 10 次/小时/IP 不变；仅开发期批量灌账号（scripts/data/D001，一次 45 次核验）时临时抬高
    ip-hourly-limit: ${VERIFY_IP_HOURLY_LIMIT:10}
    ticket-ttl-minutes: 5
  roster:
    # 学籍核验旁路（内置测试名册）：仅限开发联调；生产必须为 false（上线检查清单项）
    bypass: ${APP_ROSTER_BYPASS:true}
  code-sender:
    # log = 开发模式（验证码只打日志）；mail = 真实发送
    mode: ${CODE_SENDER_MODE:log}
  moderation:
    # 机审通道（F-SAFE-001）：log = 只记录放行（开发缺省）；local = 本地词表，命中即拦（fail-closed）；
    # 真实服务商适配待 A3-8 决策与凭据（届时新增 mode=aliyun / tencent 适配器即可）
    mode: ${MODERATION_MODE:log}
    # local 模式必填（逗号分隔）；留空即启动失败——不允许"空词表 = 静默放行"
    words: ${MODERATION_WORDS:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  ai:
    similar:
      enabled: true
      min-title-length: 6
      max-results: 3
  hot:
    # 热榜（ADR-006，CR-058）。互动分 = reply-weight×回复 + like-weight×赞 + favorite-weight×收藏，
    # hot_score = 互动分 × exp(-decay-per-hour × 小时龄)。
    # 权重与 λ 是**待试点数据调优**的参数（PRD Q6），不是结论——调参只改这里，不改代码。
    reply-weight: 3.0          # 回复权重最高：论坛的核心互动且成本最高
    like-weight: 1.0
    favorite-weight: 2.0       # 收藏成本高于点赞（要回访），互动性弱于回复
    decay-per-hour: 0.05       # ADR-006 原文值：20 小时衰减到 e^-1 ≈ 37%
    window-days: 30            # 只重算窗口内的帖子；窗口外置 0（指数衰减只降不消，不归零则老帖永久霸榜）
    batch-size: 500            # 游标分批读—算—写回，避免一次把整窗候选读进内存
    lock-ttl-seconds: 300      # ⚠️ 须 ≤ 刷新周期：锁不显式释放、靠 TTL 兜底，TTL 比周期长会把实际刷新周期变成 TTL
    # 下面两项只被 HotScoreRefreshScheduler 的 @Scheduled 占位符消费，**不绑定到 AppProperties**（避免两个事实源）
    refresh-interval-ms: ${HOT_REFRESH_INTERVAL_MS:600000}   # ADR-006 原文 10 分钟
    initial-delay-ms: ${HOT_INITIAL_DELAY_MS:15000}          # 新部署不必等一个完整周期才有分数
